# Single-host deployment for the SmartML Studio API.
#
# One small instance replaces the free-tier hosting whose 15-minute spin-down and 512MB
# ceiling were destroying sessions mid-pipeline. Caddy terminates TLS and routes by
# hostname, so a second project's backend joins by adding one service here and one block
# in the Caddyfile — no second machine.

services:
  smartml-api:
    build: .
    restart: unless-stopped
    environment:
      # The browser calls this API cross-origin from Vercel, so the frontend's origin has
      # to be listed. backend/main.py already matches this project's *.vercel.app previews
      # by pattern; this covers the production alias and any custom domain.
      SMARTML_ALLOWED_ORIGINS: ${SMARTML_ALLOWED_ORIGINS}
      SMARTML_SESSION_DIR: /data/sessions
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    volumes:
      # Named volume, not a bind mount: this is what makes session checkpoints outlive a
      # container restart or a redeploy.
      - smartml-sessions:/data/sessions
      - smartml-logs:/app/logs
    # A runaway training job must not take the whole host — including the proxy — with it.
    deploy:
      resources:
        limits:
          memory: 1400M
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # ACME account and certificates; losing this re-issues certs
      - caddy-config:/config
    depends_on:
      - smartml-api

volumes:
  smartml-sessions:
  smartml-logs:
  caddy-data:
  caddy-config:
