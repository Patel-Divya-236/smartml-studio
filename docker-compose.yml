# Single-host deployment for the SmartML Studio API.
#
# One small instance runs everything: the API needs a process that stays up, room in
# memory for the datasets, and a disk that outlives restarts. Caddy terminates TLS and routes by
# hostname, so a second project's backend joins by adding one service here and one block
# in the Caddyfile — no second machine.

services:
  smartml-api:
    build: .
    restart: unless-stopped
    environment:
      # The browser calls this API cross-origin from Vercel, so the frontend's origin has
      # to be listed. backend/main.py already matches this project's *.vercel.app previews
      # by pattern; this covers the production alias and any custom domain.
      SMARTML_ALLOWED_ORIGINS: ${SMARTML_ALLOWED_ORIGINS}
      SMARTML_SESSION_DIR: /data/sessions
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      # Both have cautious defaults in config/settings.py (512MB, one thread). Left unset here,
      # a 2GB machine would still refuse training jobs at 512MB and train on one thread.
      # The budget sits under the container's memory limit below so the app refuses a job
      # before the kernel kills the container.
      SMARTML_MEMORY_BUDGET_MB: ${SMARTML_MEMORY_BUDGET_MB:-1300}
      SMARTML_TRAINING_THREADS: ${SMARTML_TRAINING_THREADS:-2}
    volumes:
      # Named volume, not a bind mount: this is what makes session checkpoints outlive a
      # container restart or a redeploy.
      - smartml-sessions:/data/sessions
      - smartml-logs:/app/logs
    # A runaway training job must not take the whole host — including the proxy — with it.
    deploy:
      resources:
        limits:
          memory: 1400M
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # The Caddyfile's site address is {$API_DOMAIN}. Without this line the variable is
      # empty inside the container, the site block has no address, and Caddy exits on
      # start. `:?` makes compose refuse to start with a clear message instead.
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env to the hostname this API is served on}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # ACME account and certificates; losing this re-issues certs
      - caddy-config:/config
    depends_on:
      - smartml-api

  # Keeps a free DuckDNS hostname pointing at this machine.
  #
  # An EC2 instance that is stopped and started gets a new public IP every time, and the
  # frontend is built with one fixed API address. Without this, each start would mean a
  # new address, a Vercel variable change and a frontend rebuild. With it, the instance
  # re-registers its own IP within seconds of booting and nothing else has to change.
  # An Elastic IP solves the same problem but is billed even while the instance is off.
  #
  # Leaving `ip=` empty makes DuckDNS use the address the request came from, which is this
  # machine's public IP. With no token configured the service idles and does nothing, so
  # hosts with a fixed IP or their own domain can ignore it.
  duckdns:
    image: curlimages/curl:latest
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$DUCKDNS_TOKEN" ] || [ -z "$$DUCKDNS_SUBDOMAIN" ]; then
          echo "DuckDNS not configured; nothing to update."
          while true; do sleep 3600; done
        fi
        while true; do
          result=$$(curl -fsS --max-time 20 "https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=" || echo "unreachable")
          echo "$$(date -u +%FT%TZ) duckdns update for $$DUCKDNS_SUBDOMAIN: $$result"
          sleep 300
        done

volumes:
  smartml-sessions:
  smartml-logs:
  caddy-data:
  caddy-config:
